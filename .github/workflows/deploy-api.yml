name: Deploy API (Cloudflare Containers)

# Builds the FastAPI image and deploys it to Cloudflare Containers. GitHub's runner has Docker,
# which `wrangler deploy` requires to build and push the image — the local Windows machine does
# not, so CI is the build host.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   API token with Workers Scripts: Edit, Workers R2 Storage: Edit and
#                          Account Settings: Read. The container image registry is backed by R2,
#                          so pushing the image needs R2 permission. If a deploy fails with an
#                          authorization error, the message names the missing scope.
#   CLOUDFLARE_ACCOUNT_ID  Account ID from the Cloudflare dashboard URL.
#
# Also required: the Workers Paid plan. Containers have no free tier.

on:
  workflow_dispatch:
  push:
    # `test` deploys too: it is the branch used to exercise the real container build and cold
    # start without touching main. Main is the released one.
    branches: [main, test]
    paths:
      - "api/**"
      - "data/processed/**"
      - "deploy/cloudflare/**"
      - ".github/workflows/deploy-api.yml"
  pull_request:
    paths:
      - "api/**"
      - "data/processed/**"
      - "deploy/cloudflare/**"
      - ".github/workflows/deploy-api.yml"

# Never let two deploys race: the container image tag and the Worker version must move together.
concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json

      - name: Install wrangler and TypeScript
        run: npm ci

      # The committed worker-configuration.d.ts is what makes a fresh clone typecheck without
      # first running wrangler. Regenerating it here and diffing keeps it honest.
      - name: Regenerate Worker types
        run: npx wrangler types

      - name: Check generated types are committed
        run: git diff --exit-code worker-configuration.d.ts

      - name: Typecheck the Worker
        run: npx tsc --noEmit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      # The suite pins the headline targeting figures, so it also catches data/processed drift
      # that the image would otherwise ship unnoticed.
      - name: API tests
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest tests -q

  deploy:
    name: Deploy
    needs: verify
    # Deploy on a push to main or test, or a manual run; pull requests only verify.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json

      - name: Install wrangler
        run: npm ci

      - name: Check Docker is available
        run: docker info >/dev/null

      # Builds the image from the repository root context (wrangler.jsonc build_context: "../.."),
      # pushes it to the Cloudflare registry, then deploys the Worker and rolls the container out.
      - name: Deploy Worker and container
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report container status
        if: success()
        run: npx wrangler containers list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
